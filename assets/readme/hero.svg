<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <!-- Hand-authored header (no committed generator); the daily card job writes archmap/recall/ledger cards, not this file. -->
  <title id="title">allo — evidence-first tooling for AI coding agents</title>
  <desc id="desc">Profile header for allo (@alloevil). A terminal prompt reads "allo@alloevil:~$ whoami"; below it the name "allo", the positioning line "Evidence-first tooling for AI coding agents" and the tagline "Don't trust the model's self-report — check it". Under a hairline rule, three marks index the tools this profile is built around: codeblast for impact analysis, paired-eval for honest evaluation, and AgentXRay for agent observability.</desc>

  <!-- profile panel: matches the README's own #0D1117 / #E6EDF3 GitHub-dark tokens -->
  <rect width="1200" height="420" rx="26" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="25.5" fill="none" stroke="#30363D"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
    <!-- terminal prompt -->
    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#8B949E">allo@alloevil:~<tspan fill="#F7577F">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>

    <text x="64" y="166" font-size="84" font-weight="700" fill="#E6EDF3" letter-spacing="-1">allo</text>

    <text x="64" y="220" font-size="33" fill="#E6EDF3">Evidence-first tooling for AI coding agents</text>

    <text x="64" y="264" font-size="25" fill="#8B949E">Don't trust the model's self-report — check it</text>
  </g>

  <path d="M64 298 H1136" stroke="#30363D" stroke-width="1"/>

  <g id="tool-index" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
