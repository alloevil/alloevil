    <text x="880" y="342" font-size="27" font-weight="700" fill="#E6EDF3">AgentXRay</text>
    <text x="880" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#8B949E">agent observability</text>
