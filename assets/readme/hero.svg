      <circle cx="13" cy="14" r="3" fill="#E6EDF3"/>
      <circle cx="23" cy="14" r="3" fill="#F7577F"/>
      <circle cx="21" cy="30" r="3" fill="#E6EDF3"/>
      <circle cx="35" cy="30" r="3" fill="#F7577F"/>
    </g>
    <text x="504" y="342" font-size="27" font-weight="700" fill="#E6EDF3">paired-eval</text>
    <text x="504" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#8B949E">honest evaluation</text>

