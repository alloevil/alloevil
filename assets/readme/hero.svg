    <g transform="translate(816 322)">
      <path d="M5 8 V43" stroke="#8B949E" stroke-width="1.4" stroke-opacity="0.5"/>
      <rect x="9" y="8" width="7" height="5" rx="2.5" fill="#E6EDF3" fill-opacity="0.85"/>
