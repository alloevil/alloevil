      <path d="M20 8.5 A13.5 13.5 0 1 1 7.31 26.62" fill="none" stroke="#E6EDF3" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round"/>
      <path d="M20 3 A19 19 0 1 1 2.15 28.5" fill="none" stroke="#E6EDF3" stroke-width="2.2" stroke-opacity="0.32" stroke-linecap="round"/>
      <path d="M20 22 H27" stroke="#8B949E" stroke-width="1.6"/>
      <circle cx="28" cy="22" r="3" fill="none" stroke="#E6EDF3" stroke-width="2"/>
      <circle cx="20" cy="22" r="3.6" fill="#F7577F"/>
    </g>
    <text x="128" y="342" font-size="27" font-weight="700" fill="#E6EDF3">codeblast</text>
    <text x="128" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#8B949E">impact analysis</text>

    <!-- paired-eval: paired dots with CI whiskers -->
    <g transform="translate(440 322)">
      <path d="M4 22 H40" stroke="#8B949E" stroke-width="1.4" stroke-opacity="0.5"/>
      <g stroke="#8B949E" stroke-width="1.6">
